# 気分から絵をすすめる：Claude API の中継（docs/RECOMMEND.md 8.4）
name = "enter-the-painting-recommend"
main = "src/index.js"
compatibility_date = "2025-09-01"

# https://enter.sheerarts.com/api/* をこの Worker に回す（サイト本体は静的ホスティングのまま）
routes = [
  { pattern = "enter.sheerarts.com/api/*", zone_name = "sheerarts.com" }
]

[vars]
# カタログ（${SITE_ORIGIN}/catalog.json）を読むサイトの origin。末尾の / なし
SITE_ORIGIN = "https://enter.sheerarts.com"
# CORS で許す origin（カンマ区切り）。SITE_ORIGIN は自動で許す
ALLOWED_ORIGINS = "https://enter.sheerarts.com,https://sheer-jp.github.io,http://localhost:5173,https://localhost:5173"
# 応答が遅ければ claude-sonnet-5-5
CLAUDE_MODEL = "claude-opus-5-5"
# 受け付けるパス
API_PATH = "/api/recommend"

# ANTHROPIC_API_KEY は Secret（wrangler secret put ANTHROPIC_API_KEY）。ここには書かない
